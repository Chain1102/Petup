 else{const first=S.lastWake!==dk();if(first){S.streak++;S.best=Math.max(S.best,S.streak);S.lastWake=dk();P().exp+=25;P().coins+=10;P().wakeAt=Date.now();lvl()}log('wake');feed(true);m=first?`ตื่นแล้ว! สตรีค ${S.streak} วัน 🔥  +25 EXP +10 🪙`:'ตื่นแล้ว วันนี้ได้สตรีคไปแล้วนะ'}
 joyUntil=Date.now()+8000;ring.stage='done';ring.msg=m;save();rOv();render()}

 else{const q=ring.mode==='shake'?`<div class="big shake" aria-hidden="true">📱</div><div class="big" id="qn">${ring.n} / 15</div><p class="mut">เขย่าโทรศัพท์ให้ครบ</p><button class="p" id="sb" onclick="useShake()">เปิดเซ็นเซอร์แล้วเขย่า</button><p><button class="g" onclick="ring.mode='math';rOv()">ทำโจทย์เลขแทน</button></p>`
 :`<div class="big">${ring.q.t} = ?</div><p class="mut">ตอบให้ถูก 3 ข้อ (${ring.ok}/3)</p><input id="an" type="number" inputmode="numeric" autofocus onkeydown="event.key==='Enter'&&ans()"><p><button class="p" onclick="ans()">ตอบ</button></p>`;
 b=`${petImg(p.type,ring.stage==='done'?'joy':'sleepy','')}<h2>${ring.test?'ทดสอบปลุก':esc(p.name)+' เรียกให้ตื่น!'}</h2><p class="mut">${esc(ring.label)} · ต้องทำ Quest ถึงจะหยุดเสียง</p>${q}<p class="mut" id="esc"></p>`}
 o.innerHTML=`<div class="ring">${b}</div>`;if(ring.stage==='done'){o.tabIndex=-1;o.focus()}else{const f=o.querySelector('input,button');f&&f.focus()}}

const ovState=on=>{['.app','nav'].forEach(q=>{const e=$(q);e&&(e.inert=on)});$('#ov').setAttribute('aria-modal',on?'true':'false')};
function play(){const t=dk();if(S.play.d!==t)S.play={d:t,n:0};
 if(S.play.n>=3){toast('วันนี้เล่นพอแล้ว ให้น้องพักนะ');return}
 if(hunger()<25){toast(P().name+' หิวเกินกว่าจะเล่น ให้อาหารก่อนนะ');return}
 if(energy()<15){toast(P().name+' เหนื่อยแล้ว ขอพักก่อน 😴');return}
 S.play.n++;P().exp+=8;P().coins+=1;const h=hunger()-5;P().h0=Math.max(0,h);P().fedAt=Date.now();P().wakeAt-=2*36e5;joyUntil=Date.now()+6000;lvl();log('play');save();talkNow();render()}
let talkUntil=0,talkTxt='',petAt=0;
function talkNow(){const d=P().type==='dog',r=Math.random()*3|0;talkTxt=d?['โฮ่ง!','โฮ่ง โฮ่ง!','Woof!'][r]:['เมี๊ยว~','เมี้ยว!','Meow~'][r];talkUntil=Date.now()+1300;if(d){beep(320,.12);setTimeout(()=>beep(260,.15),140)}else{beep(650,.3);setTimeout(()=>beep(520,.25),180)}setTimeout(render,1350)}
document.addEventListener('click',e=>{if(!e.target.closest('#main .pw')||!S||ring||Date.now()-petAt<1500)return;petAt=Date.now();joyUntil=Math.max(joyUntil,Date.now()+3500);navigator.vibrate&&navigator.vibrate(15);talkNow();render()});
const missedCard=()=>S.missed.length?`<section class="card" style="border-color:var(--berry)"><h3>📌 พลาดไป ${S.missed.length} อย่าง</h3>${S.missed.map(m=>`<div class="it"><span>${esc(m.text)}</span><span class="mut">${fmt(m.at)}</span></div>`).join('')}<button class="g" style="width:100%" onclick="S.missed=[];save();render()">รับทราบ</button></section>`:'';
const SD=['อา','จ','อ','พ','พฤ','ศ','ส'];
const wk=()=>{let h='';for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5),k=dk(d),ok=S.log.some(x=>x.k==='wake'&&dk(new Date(x.t))===k);h+=`<div style="text-align:center"><div style="font-size:22px">${ok?'🔥':'⚪'}</div><div class="mut">${SD[d.getDay()]}</div></div>`}return`<div style="display:flex;justify-content:space-between;margin:10px 0"><span class="mut" style="align-self:center">7 วันล่าสุด</span>${h}</div>`};
const look=()=>{const p=P(),ks=p.type==='dog'?Object.keys(DV):Object.keys(PAL),cur=ks.includes(p.style)?p.style:DEF[p.type];
 return`<section class="card"><h3>🎨 หน้าตาของ ${esc(p.name)}</h3><div class="row wr">${ks.map(k=>`<button class="g sb" aria-pressed="${k===cur}" onclick="setLook('${k}')" style="padding:6px;${k===cur?'outline:3px solid var(--vio)':''}">${face(p.type,'happy','mini','',k)}<small>${STN[k]}</small></button>`).join('')}</div><div class="row" style="margin-top:10px"><button class="g" onclick="setType('dog')" ${p.type==='dog'?'disabled':''}>🐶 เปลี่ยนเป็นสุนัข</button><button class="g" onclick="setType('cat')" ${p.type==='cat'?'disabled':''}>🐱 เปลี่ยนเป็นแมว</button></div></section>`};
function setLook(k){P().style=k;save();render()}
function setType(t){if(P().type===t)return;P().type=t;P().style=DEF[t];save();render();toast('เปลี่ยนแล้ว 🐾')}
/* ---- pages ---- */
const bar=(l,v,c='')=>`<div class="st ${c}"><span>${l}</span><i><b style="width:${v}%"></b></i><em>${v}</em></div>`;
function say(){const h=hunger(),m=mood();if(m==='joy')return'อิ่มแล้ว มีความสุขสุด ๆ ❤️';if(m==='sleepy'&&h>=25)return'ง่วงจัง... 😴';return h<25?'หิวแล้วนะ 🥺':S.streak>=3?'เรากับเธอสตรีค '+S.streak+' วันแล้ว ❤️':happy()>70?'วันนี้อารมณ์ดีสุด ๆ':'พร้อมช่วยดูแลวันของเธอแล้ว'}
function home(){const p=P(),t=dk(),n=S.feeds.d===t?S.feeds.n:0,pn=S.play&&S.play.d===t?S.play.n:0;
 const nx=S.alarms.filter(a=>a.on).map(a=>a.time).sort()[0],td=S.rem.filter(r=>!r.done&&dk(new Date(r.at))===t).sort((a,b)=>a.at-b.at);
 return missedCard()+`<section class="card hero">${petImg(p.type,mood(),p.type==='dog'?'สุนัข':'แมว')}<div class="name">${esc(p.name)}</div><div class="mut">เลเวล ${p.level}</div>
 <div class="say">${say()}</div><div style="margin-top:12px">${bar('หิว',hunger(),'h')}${bar('สุข',happy())}${bar('พลัง',energy())}${bar('EXP',p.exp,'x')}</div>
 <div class="row act"><button class="p" onclick="feed()">🍖 ให้อาหาร (${n}/3)</button><button class="p" onclick="play()">🎾 เล่นด้วย (${pn}/3)</button></div><p class="mut" style="margin:10px 0 0">แตะที่ตัวน้องเพื่อลูบหัวได้ 🐾</p></section>
 <section class="card"><h3>⏰ ปลุกถัดไป</h3><div>${nx||'<span class="mut">ยังไม่ได้ตั้งปลุก</span>'}</div><p class="mut">รางวัลตื่นเช้า (สตรีค +25 EXP) ได้จากการทำ Quest ตอนปลุกดังเท่านั้น</p></section>
 <section class="card"><h3>🧠 วันนี้มี ${td.length} อย่าง</h3>${td.map(r=>`<div class="it"><span>${esc(r.text)}</span><span class="mut">${fmt(r.at).slice(-5)}</span></div>`).join('')||'<span class="mut">ว่างเลย ไปบอกเลขาได้นะ</span>'}</section>`}
function alarm(){return`<section class="card"><h3>⏰ ตั้งปลุก</h3>${PA?readyCard():'<div class="warn">เวอร์ชันเว็บนี้ปลุกดังได้เมื่อเปิดหน้านี้ค้างไว้เท่านั้น แอปจริงต้องใช้ระบบปลุกของมือถือ (iOS AlarmKit / Android exact alarm)</div>'}
 <div class="row" style="margin:10px 0"><input type="time" id="nt" value="07:00" aria-label="เวลาปลุก"><button class="f0" onclick="addA()">เพิ่ม</button></div>
 ${S.alarms.map((a,i)=>`<div class="it"><b>${a.time}</b><label><input type="checkbox" style="width:auto" ${a.on?'checked':''} onchange="S.alarms[${i}].on=this.checked;save();askN()"> เปิด</label><button class="g" onclick="S.alarms.splice(${i},1);save();render()">ลบ</button></div>`).join('')||'<p class="mut">ยังไม่มีปลุก</p>'}
 <p><button class="g" style="width:100%" onclick="toast('จะดังใน 10 วินาที');setTimeout(()=>startRing('ทดสอบ',true),10000)">ทดสอบปลุกใน 10 วินาที</button></p></section>`}
function sec(){const l=S.rem.filter(r=>!r.done).sort((a,b)=>a.at-b.at),rp=r=>r.rep||(r.daily?864e5:0),n=new Date(Date.now()+36e5),dd=dk(n),tm=pad(n.getHours())+':00';
 return`<section class="card"><h3>🧠 เลขาของ ${esc(P().name)}</h3>${pend?`<div class="warn">เตือน “${esc(pend)}” ตอนไหนดี? พิมพ์เวลา เช่น “พรุ่งนี้ 8 โมง” <button class="g" onclick="pend=null;render()">ยกเลิก</button></div>`:`<p class="mut">พิมพ์แบบที่พูดจริง เช่น “พรุ่งนี้ 9 โมงเตือนให้ส่งงาน”, “ทุกวันจันทร์ 7 โมงเตือนวิ่ง”, “อีก 30 นาทีเตือนพักสายตา” หรือถาม “พรุ่งนี้มีอะไรต้องทำบ้าง”</p>`}
 <input id="tx" placeholder="บอกเลขาได้เลย" aria-label="พิมพ์ถึงเลขา" onkeydown="event.key==='Enter'&&parseAdd()"><p><button class="p" onclick="parseAdd()">จำให้เลย</button></p></section>${ansTxt?`<section class="card">${ansTxt}</section>`:''}
 <section class="card" id="pk"><h3>📅 เลือกวันและเวลาเอง</h3>${editId?'<p class="mut">กำลังแก้ไขรายการ แก้แล้วกดบันทึก</p>':''}
 <label class="mut" for="tk">เรื่องที่จะให้เตือน</label><input id="tk" placeholder="เช่น ส่งงาน" maxlength="80">
 <div class="row" style="margin-top:8px"><div><label class="mut" for="dt">วันที่</label><input type="date" id="dt" value="${dd}" min="${dk()}" oninput="pv()"></div><div><label class="mut" for="tm">เวลา</label><input type="time" id="tm" value="${tm}" oninput="pv()"></div></div>
 <label class="mut" for="rp">ความถี่</label><select id="rp"><option value="0">ครั้งเดียว</option><option value="86400000">ทุกวัน</option><option value="604800000">ทุกสัปดาห์</option></select>
 <p id="pv" aria-live="polite" style="font-weight:600;margin:10px 0">${fmtL(new Date(dd+'T'+tm).getTime())}</p><button class="p" onclick="addP()">${editId?'บันทึกการแก้ไข':'ตั้งเตือน'}</button></section>
 <section class="card"><h3>รายการที่จำไว้</h3>${l.map(r=>`<div class="it"><div>${esc(r.text)}<div class="mut">${fmtL(r.at)}${rp(r)?(rp(r)>864e5?' · ทุกสัปดาห์':' · ทุกวัน'):''}</div></div><div class="row f0"><button class="g" onclick="edit(${r.id})">แก้</button><button class="g" onclick="S.rem=S.rem.filter(x=>x.id!==${r.id});save();render()">ลบ</button></div></div>`).join('')||'<p class="mut">ยังไม่มีรายการ</p>'}</section>`}
function stats(){const c=k=>S.log.filter(x=>x.k===k).length,r=c('ring'),w=c('wake'),days=new Set(S.log.map(x=>dk(new Date(x.t)))).size;
 return`<section class="card"><h3>📊 สถิติของคุณ</h3><div class="it"><span>🔥 สตรีคตอนนี้ / สูงสุด</span><b>${S.streak} / ${S.best}</b></div><div class="it"><span>🪙 เหรียญ</span><b>${P().coins}</b></div><div class="it"><span>🧊 Streak Freeze</span><b>${S.freezes}/2</b></div>
 <div class="it"><span>อัตราตื่นสำเร็จ (Wake Success)</span><b>${r?Math.round(w/r*100)+'%':'–'} (${w}/${r})</b></div><div class="it"><span>วันที่เปิดใช้งาน</span><b>${days}</b></div>
 ${wk()}<p><button class="g" style="width:100%" ${P().coins<30||S.freezes>=2?'disabled':''} onclick="P().coins-=30;S.freezes++;save();render()">ซื้อ Streak Freeze (30 🪙)</button></p></section>
 ${look()}<section class="card"><h3>💾 สำรองข้อมูล</h3><p class="mut">ข้อมูลเก็บในเบราว์เซอร์นี้ ล้างข้อมูลแล้วสัตว์เลี้ยงจะหาย ส่งออกเก็บไว้ได้</p><textarea id="bk" rows="3" aria-label="ข้อมูลสำรอง"></textarea>
 <div class="row" style="margin-top:8px"><button class="g" onclick="$('#bk').value=JSON.stringify(S)">ส่งออก</button><button class="g" onclick="imp()">นำเข้า</button><button class="g" onclick="confirm('เริ่มใหม่ทั้งหมด?')&&(localStorage.removeItem(K),location.reload())">รีเซ็ต</button></div></section>`}
function imp(){try{const o=JSON.parse($('#bk').value);if(!o.pet||!o.alarms)throw 0;S=o;save();render();toast('นำเข้าแล้ว')}catch(e){toast('ข้อมูลไม่ถูกต้อง')}}
function addA(){const v=$('#nt').value;if(v){S.alarms.push({time:v,on:true});save();askN();render()}}
function askN(){if(LN){nativePerm();return}try{'Notification'in window&&Notification.permission==='default'&&Notification.requestPermission()}catch(e){}}
function setup(){let ty='dog',st=DEF.dog,nm='';const o=$('#ov');o.className='show';ovState(true);
 const go=()=>{const n=$('#nm').value.trim();if(!n){toast('ตั้งชื่อก่อนนะ · Please name your pet');return}const t=Date.now();
  S={pet:{type:ty,style:st,name:n,level:1,exp:0,coins:0,h0:70,fedAt:t,wakeAt:t},streak:0,best:0,lastWake:null,freezes:1,feeds:{d:'',n:0},alarms:[{time:'07:00',on:true}],rem:[],log:[],fired:{},missed:[],play:{d:'',n:0}};log('start');save();askN();ovState(false);o.className='';o.innerHTML='';render()};
 const draw=()=>{const ks=ty==='dog'?Object.keys(DV):Object.keys(PAL),ab=(t,id,lb)=>`<button class="g" id="${id}" aria-pressed="${ty===t}" style="${ty===t?'outline:3px solid var(--vio)':''}">${face(t,'happy','mini','',ty===t?st:DEF[t])}${lb}</button>`;
  o.innerHTML=`<div class="ring"><div class="big">🐾</div><h2>ยินดีต้อนรับสู่ PetUp<br><small class="mut">Welcome to PetUp</small></h2><p class="mut">เลือกเพื่อนของคุณ · Choose your companion</p><div class="row">${ab('dog','d','สุนัข · Dog')}${ab('cat','c','แมว · Cat')}</div><p class="mut">เลือกหน้าตา · Pick a look</p><div class="row wr">${ks.map(k=>`<button class="g sb" data-k="${k}" aria-pressed="${k===st}" style="padding:6px;${k===st?'outline:3px solid var(--vio)':''}">${face(ty,'happy','mini','',k)}<small>${STN[k]}</small></button>`).join('')}</div><p><input id="nm" placeholder="ตั้งชื่อ · Name (ไทย / English)" maxlength="16" autocomplete="off" aria-label="ชื่อสัตว์เลี้ยง Pet name"></p><button class="p" id="go">เริ่มเลย · Start</button></div>`;
  $('#nm').value=nm;$('#nm').oninput=e=>{nm=e.target.value};
  $('#d').onclick=()=>{ty='dog';st=DEF.dog;draw()};$('#c').onclick=()=>{ty='cat';st=DEF.cat;draw()};
  o.querySelectorAll('.sb').forEach(b=>b.onclick=()=>{st=b.dataset.k;draw()});
  $('#go').onclick=go;$('#nm').onkeydown=e=>{if(e.key==='Enter')go()}};

const TABS=[['home','🏠','หน้าหลัก'],['alarm','⏰','ปลุก'],['sec','🧠','เลขา'],['stats','📊','สถิติ']];
function bnR(){const e=$('#bn');if(!e)return;e.innerHTML=ring?'':due.map(d=>`<div class="card" style="border-color:var(--sun)"><b>🐾 ${esc(P().name)}: ถึงเวลา “${esc(d.text)}” แล้ว</b><div class="row" style="margin-top:8px"><button class="g" onclick="snz('${d.k}',5)">อีก 5 นาที</button><button class="g" onclick="snz('${d.k}',10)">อีก 10 นาที</button><button class="g" onclick="snz('${d.k}',30)">อีก 30 นาที</button></div><p style="margin:8px 0 0"><button class="p" onclick="rdone('${d.k}')">เสร็จแล้ว</button></p></div>`).join('')}

function render(){if(!S)return;bnR();if(ring)return;lastMood=mood();$('#top').textContent='🔥 '+S.streak+'  🪙 '+P().coins;
 $('#nav').innerHTML=TABS.map(t=>`<a role="button" tabindex="0" class="${page===t[0]?'on':''}" onclick="page='${t[0]}';render()" onkeydown="event.key==='Enter'&&(page='${t[0]}',render())"><span>${t[1]}</span>${t[2]}</a>`).join('');
 $('#main').innerHTML=({home,alarm,sec,stats})[page]()}
function tick(){if(!S)return;if(PA&&!ring&&!nr&&Date.now()-lastPoll>1500){lastPoll=Date.now();PA.status().then(r=>{if(r.ringing&&!ring){nr=true;startRing('ปลุก '+(r.label||''),false,true)}}).catch(()=>{})}const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes());checkStreak();for(const k in S.fired)if(!k.startsWith(dk()))delete S.fired[k];
 if(!ring&&!PA)S.alarms.forEach(a=>{const key=dk()+a.time;if(a.on&&a.time===hm&&S.fired[key]!==1){S.fired[key]=1;save();startRing('ปลุก '+a.time,false)}});
 S.rem.forEach(r=>{if(!r.done&&r.at<=Date.now()){if(Date.now()-r.at<6e5){due.push({k:Date.now()+'_'+r.id,text:r.text});window.petup&&petup.wake&&petup.wake();notify(r.text);beep(1000,.4);log('rem_fire')}else{S.missed.push({text:r.text,at:r.at});S.missed=S.missed.slice(-20)}const rp=r.rep||(r.daily?864e5:0);if(rp){while(r.at<=Date.now())r.at+=rp}else r.done=true;save();render()}});
 if(ring&&ring.stage==='q'){const e=$('#esc');if(e&&Date.now()-ring.t0>9e4){e.innerHTML='<button class="g" onclick="fin(true)">ข้ามปลุก (ไม่นับสตรีค)</button>'}}
 if(!ring&&mood()!==lastMood)render();else if(!ring&&page==='home'&&n.getSeconds()===0)render()}
if(!S)setup();else{S.freezes??=1;S.fired??={};S.missed??=[];S.play??={d:'',n:0};checkStreak();log('open');render()}
setInterval(tick,1000);
if(LN){LN.addListener('localNotificationActionPerformed',e=>{const x=(e.notification&&e.notification.extra)||{};if(S&&x.type==='alarm')startRing('ปลุก '+(x.time||''),false)});if(S)nativePerm();syncN();refreshRD();document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastPoll=0;refreshRD()}})}
</script></body></html>
