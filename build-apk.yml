name: Build Android APK

on:
  workflow_dispatch:        # กดรันเองที่แท็บ Actions
  push:
    tags: ['v*']            # สร้าง Release ชื่อ v1.0.0 ฯลฯ -> ได้ลิงก์ดาวน์โหลดถาวร

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Install native alarm module
        run: node scripts/patch-android.js
      - name: Generate icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#6a4dff'
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PetUp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PetUp-apk
          path: PetUp.apk
      - name: Attach APK to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PetUp.apk
